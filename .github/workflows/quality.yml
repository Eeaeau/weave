name: Godot quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install Blender
        uses: BradyAJohnston/setup-blender@9d0ba03aa0f7be59e09bdc70e08418a4298185f7 # v5
        with:
          version: "5.2.2"

      - name: Configure Godot Blender importer
        run: |
          blender_path="$(command -v blender)"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "filesystem/import/blender/blender_path = \"$blender_path\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Run project checks
        run: python3 tools/check.py
