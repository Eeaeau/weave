name: Godot quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install Blender
        uses: BradyAJohnston/setup-blender@v5
        with:
          version: "4.5"

      - name: Configure Godot Blender importer
        run: |
          blender_path="$(command -v blender)"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "filesystem/import/blender/blender_path = \"$blender_path\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Run project checks
        run: python3 tools/check.py
