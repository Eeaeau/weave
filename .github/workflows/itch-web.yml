name: Build and deploy web to itch.io

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload this build to itch.io
        type: boolean
        required: true
        default: false
      channel:
        description: itch.io channel name
        type: choice
        options: [html5]
        required: true
        default: html5

concurrency:
  group: itch-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    environment: ${{ github.ref == 'refs/heads/main' && 'spiders-production' || 'spiders-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check production runtime configuration
        if: github.ref == 'refs/heads/main'
        env:
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
        run: |
          : "${GDSYNC_PUBLIC_KEY:?Add GDSYNC_PUBLIC_KEY to spiders-production}"
          : "${GDSYNC_PRIVATE_KEY:?Add GDSYNC_PRIVATE_KEY to spiders-production}"

      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Blender
        uses: BradyAJohnston/setup-blender@9d0ba03aa0f7be59e09bdc70e08418a4298185f7 # v5
        with:
          version: "5.2.2"

      - name: Configure Godot Blender importer
        run: |
          blender_path="$(command -v blender)"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "filesystem/import/blender/blender_path = \"$blender_path\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Run local quality gate
        run: python3 tools/check.py

      - name: Export Web build
        env:
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html

      - name: Save build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: godot-web-build
          path: build/web/
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    environment: itch-production
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: godot-web-build
          path: ${{ runner.temp }}/web

      - name: Install verified butler
        env:
          BUTLER_VERSION: "15.32.0"
          BUTLER_SHA256: "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5"
        run: |
          curl -fsSL "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default" -o "$RUNNER_TEMP/butler.zip"
          printf '%s  %s\n' "$BUTLER_SHA256" "$RUNNER_TEMP/butler.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_CHANNEL: ${{ inputs.channel || 'html5' }}
        run: |
          : "${BUTLER_API_KEY:?Add BUTLER_API_KEY to itch-production}"
          "$RUNNER_TEMP/butler/butler" push "$RUNNER_TEMP/web" "eeaeau/spiders:$ITCH_CHANNEL" --userversion "${GITHUB_SHA::7}"
