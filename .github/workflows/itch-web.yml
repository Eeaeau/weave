name: Build and deploy web to itch.io

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload this build to itch.io
        type: boolean
        required: true
        default: false
      channel:
        description: itch.io channel name
        type: string
        required: true
        default: html5

concurrency:
  group: itch-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment configuration
        env:
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) }}
        run: |
          : "${GDSYNC_PUBLIC_KEY:?Add the GDSYNC_PUBLIC_KEY Actions secret}"
          : "${GDSYNC_PRIVATE_KEY:?Add the GDSYNC_PRIVATE_KEY Actions secret}"
          if [[ "$PUBLISH" == "true" ]]; then
            : "${BUTLER_API_KEY:?Add the BUTLER_API_KEY Actions secret}"
          fi

      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Blender
        uses: BradyAJohnston/setup-blender@9d0ba03aa0f7be59e09bdc70e08418a4298185f7 # v5
        with:
          version: "5.2.2"

      - name: Configure Godot Blender importer
        run: |
          blender_path="$(command -v blender)"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "filesystem/import/blender/blender_path = \"$blender_path\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Run local quality gate
        run: python3 tools/check.py

      - name: Export Web build
        env:
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html

      - name: Save build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: godot-web-build
          path: build/web/
          retention-days: 7

      - name: Install butler
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        run: |
          curl -fsSL 'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default' -o butler.zip
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Upload to itch.io
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER || 'eeaeau' }}
          ITCH_GAME: ${{ vars.ITCH_GAME || 'spiders' }}
          ITCH_CHANNEL: ${{ inputs.channel || 'html5' }}
        run: |
          : "${BUTLER_API_KEY:?Set the BUTLER_API_KEY repository secret}"
          : "${ITCH_USER:?Set the ITCH_USER repository variable}"
          : "${ITCH_GAME:?Set the ITCH_GAME repository variable}"
          : "${ITCH_CHANNEL:?Choose a channel}"
          butler push build/web "$ITCH_USER/$ITCH_GAME:$ITCH_CHANNEL" --userversion "${GITHUB_SHA::7}"
